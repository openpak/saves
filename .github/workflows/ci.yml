name: ci

# vet, build and the race tests on every vX.Y.Z tag (and on a manual run). The database flows are the
# point of this job: SAVES_TEST_REQUIRE_DB makes a missing database a failure instead of a
# skip, so a green run cannot mean "the integration tests did not run".
#
# Runs on the OpenPak self-hosted runner for the same reason release.yml does: this repository
# is private and GitHub-hosted minutes are metered. That runner has podman and no docker, so
# Postgres is a container this job starts itself rather than a `services:` block — on a port
# podman picks, because the runner is somebody's workstation and 23001 is often already a
# test database of their own.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  test:
    runs-on: [self-hosted, linux, podman]
    env:
      SAVES_TEST_REQUIRE_DB: '1' # a skipped database flow is a failure, not a green run
      DB: saves-ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Scratch in the workspace, not the runner's shared /tmp
        # /tmp is a RAM disk every build on the machine shares; when it filled on
        # 2026-09-24 a compiler died and a job hung for hours instead of failing.
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.tmp"
          echo "TMPDIR=$GITHUB_WORKSPACE/.tmp" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: start postgres
        run: |
          podman run -d --name "$DB" -e POSTGRES_PASSWORD=test -e POSTGRES_DB=saves_test \
            -p 127.0.0.1::5432 docker.io/library/postgres:18-alpine
          port=$(podman port "$DB" 5432/tcp | head -1 | sed 's/.*://')
          echo "SAVES_TEST_DATABASE_URL=postgres://postgres:test@127.0.0.1:$port/saves_test?sslmode=disable" >> "$GITHUB_ENV"
          for i in $(seq 30); do
            podman exec "$DB" pg_isready -U postgres && exit 0
            sleep 2
          done
          echo "postgres never became ready"; podman logs "$DB"; exit 1
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
      - name: stop postgres
        if: always()
        run: podman rm -f "$DB" || true
      - name: Clear scratch
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/.tmp"
