name: ci

# vet, build and the race tests on every vX.Y.Z tag (and on a manual run). The database flows are the
# point of this job: SAVES_TEST_REQUIRE_DB makes a missing database a failure instead of a
# skip, so a green run cannot mean "the integration tests did not run".
#
# Runs on a GitHub-hosted runner with Postgres as a service container on a port the runner picks.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: saves_test
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      SAVES_TEST_REQUIRE_DB: '1' # a skipped database flow is a failure, not a green run
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: database url
        run: echo "SAVES_TEST_DATABASE_URL=postgres://postgres:test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/saves_test?sslmode=disable" >> "$GITHUB_ENV"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
