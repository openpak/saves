name: release

# Tag a release (v1.2.3) and this publishes ghcr.io/openpak/<repo>:1.2.3, :1.2 and :latest for
# amd64 and arm64. Deployed hosts run podman-auto-update against :latest, so pushing a tag is
# the deploy. Runs on the OpenPak self-hosted runner (podman + qemu binfmt), so it costs no
# GitHub-hosted minutes; this repository is private and those are metered.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: [self-hosted, linux, podman]
    env:
      REGISTRY_AUTH_FILE: ${{ runner.temp }}/auth.json # job-scoped login; never the runner user's own
    steps:
      - uses: actions/checkout@v4
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: |
          set -e
          IMG="ghcr.io/${{ github.repository }}"
          case "${GITHUB_REF_NAME}" in v*) VER="${GITHUB_REF_NAME#v}";; *) VER="";; esac
          podman manifest rm "$IMG:build" 2>/dev/null || true
          podman build --platform linux/amd64,linux/arm64 --manifest "$IMG:build" .
          TAGS="latest"; [ -n "$VER" ] && TAGS="$TAGS $VER $(echo "$VER" | cut -d. -f1,2)"
          for t in $TAGS; do podman manifest push --all "$IMG:build" "docker://$IMG:$t"; done
          podman manifest rm "$IMG:build"
          echo "pushed $IMG: $TAGS"
